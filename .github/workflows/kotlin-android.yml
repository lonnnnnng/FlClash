name: KClash Android Kotlin

on:
  # 作者 long：只接受版本标签或明确指定标签/源码的手动发版，普通代码提交不启动 Android 发布构建。
  push:
    tags:
      - 'kclash-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new KClash release tag (kclash-vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_ref:
        description: Git ref to build for that release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kclash-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish KClash Android arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 作者 long：SDK37采用主次版本包名，需要与本地一致的23.0命令行工具解析仓库。
          cmdline-tools-version: '16111833'
          # 作者 long：包安装在下一步经Android CLI完成，避免setup action继续调用已弃用的sdkmanager。
          accept-android-sdk-licenses: false
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          android_cli="$ANDROID_HOME/cmdline-tools/16111833/bin/android"
          test -x "$android_cli"
          # 作者 long：CI通过Android CLI安装与项目compileSdk/NDK一致的组件，并在首次安装时接受对应许可。
          "$android_cli" --sdk="$ANDROID_HOME" sdk install \
            "platforms/android-37.0" "build-tools/36.0.0" "ndk/28.2.13676358" "platform-tools" < <(yes)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve build version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$release_tag" =~ ^kclash-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "KClash tags must use kclash-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version_name="${release_tag#kclash-v}"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "KClash tags must use kclash-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version_name"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Kotlin arm64 build"
            echo "- versionName: \`$version_name\`"
            echo "- versionCode: \`$version_code\`"
            echo '- trigger: signed Kotlin release tag'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure KClash release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KCLASH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KCLASH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KCLASH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KCLASH_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          chmod 600 android/app/keystore.jks
          echo "KCLASH_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android/app/keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed arm64 Release APK
        env:
          BUILD_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BUILD_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          KCLASH_RELEASE_STORE_PASSWORD: ${{ secrets.KCLASH_RELEASE_STORE_PASSWORD }}
          KCLASH_RELEASE_KEY_ALIAS: ${{ secrets.KCLASH_RELEASE_KEY_ALIAS }}
          KCLASH_RELEASE_KEY_PASSWORD: ${{ secrets.KCLASH_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon -Ptarget-platform=android-arm64 \
            -PkclashVersionName="$BUILD_VERSION_NAME" \
            -PkclashVersionCode="$BUILD_VERSION_CODE"

      - name: Verify Release artifact
        id: release-artifact
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          unzip -Z1 "$apk" | awk -F/ '$1 == "lib" {print}' | tee /tmp/kclash-libs.txt
          test "$(awk -F/ '$1 == "lib" {print $2}' /tmp/kclash-libs.txt | sort -u | tr -d ' ' | wc -l)" -eq 1
          test "$(awk -F/ '$1 == "lib" {print $2}' /tmp/kclash-libs.txt | sort -u | tr -d ' ')" = "arm64-v8a"
          test "$(apkanalyzer manifest application-id "$apk")" = "com.lonnnnnng.flclash"
          test "$(apkanalyzer manifest version-name "$apk")" = "$VERSION_NAME"
          test "$(apkanalyzer manifest version-code "$apk")" = "$VERSION_CODE"
          test "$(apkanalyzer manifest debuggable "$apk")" = "false"
          test "$(apkanalyzer manifest min-sdk "$apk")" = "24"
          # 作者 long：扫码组件从清单反射创建，必须检查最终DEX构造器，Debug回归不能覆盖R8裁剪。
          python3 tool/check_mlkit_release.py "$apk"
          # 作者 long：JVM/Debug不经过R8，直接检查Release映射，防止YAML静态初始化再次丢失包名。
          for type in org.yaml.snakeyaml.TypeDescription org.yaml.snakeyaml.introspector.PropertySubstitute; do
            if grep -Fq "$type -> " android/app/build/outputs/mapping/release/mapping.txt; then
              grep -Fqx "$type -> $type:" android/app/build/outputs/mapping/release/mapping.txt
            else
              # 作者 long：未使用的JavaBean路径可被删除；必须由R8 usage证实，不能把映射缺失当通过。
              grep -Fqx "$type" android/app/build/outputs/mapping/release/usage.txt
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > android/app/build/outputs/apk/release/signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 3d6cf8aab47ed321b7ca4b3c85960c63168d57ca9f35bd03e739c815444c0f49' android/app/build/outputs/apk/release/signature.txt
          artifact_apk="KClash-${VERSION_NAME}-android-arm64-v8a.apk"
          if [[ "$apk" != "android/app/build/outputs/apk/release/$artifact_apk" ]]; then
            cp "$apk" "android/app/build/outputs/apk/release/$artifact_apk"
          fi
          (cd android/app/build/outputs/apk/release && shasum -a 256 "$artifact_apk" > SHA256SUMS)
          echo "apk_name=$artifact_apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: KClash ${{ steps.metadata.outputs.version_name }}
          body_path: docs/releases/${{ steps.metadata.outputs.release_tag }}.md
          files: |
            android/app/build/outputs/apk/release/${{ steps.release-artifact.outputs.apk_name }}
            android/app/build/outputs/apk/release/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: Remove runner signing material
        if: always()
        run: rm -f -- android/app/keystore.jks
